<!-- Inline Script for Celebratory Delight Confetti Micro-interaction -->
<script>
    (function () {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const colors = ['#005c55', '#97f5cc', '#80d5cb', '#0f766e', '#ffe4d7'];
      const particles = [];
      const particleCount = 38;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: width / 2 + (Math.random() - 0.5) * 80,
          y: height * 0.28 + (Math.random() - 0.5) * 40,
          vx: (Math.random() - 0.5) * 6,
          vy: Math.random() * -6 - 2,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          alpha: 1,
          decay: Math.random() * 0.015 + 0.008
        });
      }

      let animationFrame;
      function render() {
        ctx.clearRect(0, 0, width, height);
        let active = false;

        particles.forEach((p) => {
          if (p.alpha > 0.02) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.18; // gravity
            p.rotation += p.vRot;
            p.alpha -= p.decay;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
            ctx.restore();
          }
        });

        if (active) {
          animationFrame = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, width, height);
        }
      }

      animationFrame = requestAnimationFrame(render);

      // Micro-interactions for Action Buttons
      const returnBtn = document.getElementById('resume-route-btn');
      if (returnBtn) {
        returnBtn.addEventListener('click', () => {
          returnBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Applying Detour...</span>';
          setTimeout(() => {
            window.location.hash = '#live-navigation';
          }, 600);
        });
      }
    })();
  </script>
