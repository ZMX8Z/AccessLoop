x-zenith:
  catalog:
    name: AccessLoop
    description: Accessible campus places, wheelchair route planning, and temporary barrier reports.
    authors:
      - AccessLoop contributors
    source: https://github.com/ZMX8Z/AccessLoop
    license: UNLICENSED
    tags:
      - accessibility
      - maps
      - nextjs
  expose:
    - service: web
      port: 3000
      web: true
  storage:
    database:
      volume: postgres-data
      label: AccessLoop PostgreSQL data
  env:
    APP_BASE_URL:
      alias: ZENITH_PUBLIC_URL
      services:
        - web
    PAYLOAD_SECRET:
      generate: "[A-Za-z0-9]{64}"
      services:
        - web
    SESSION_SECRET:
      generate: "[A-Za-z0-9]{64}"
      services:
        - web
    DATABASE_URL:
      input:
        label: PostgreSQL URL
        secret: true
        required: true
      services:
        - web
    POSTGRES_PASSWORD:
      input:
        label: PostgreSQL password matching DATABASE_URL
        secret: true
        required: true
      services:
        - db
    ADMIN_EMAIL:
      input:
        label: ADMIN EMAIL
        secret: false
        required: true
      services:
        - web
    ADMIN_PASSWORD:
      input:
        label: ADMIN PASSWORD
        secret: true
        required: true
      services:
        - web
    OSS_ENDPOINT:
      input:
        label: OSS ENDPOINT
        secret: false
        required: true
      services:
        - web
    OSS_BUCKET:
      input:
        label: OSS BUCKET
        secret: false
        required: true
      services:
        - web
    OSS_REGION:
      input:
        label: OSS REGION
        secret: false
        required: true
      services:
        - web
    OSS_ACCESS_KEY_ID:
      input:
        label: OSS ACCESS KEY ID
        secret: true
        required: true
      services:
        - web
    OSS_ACCESS_KEY_SECRET:
      input:
        label: OSS ACCESS KEY SECRET
        secret: true
        required: true
      services:
        - web
    OSS_SIGNED_URL_TTL_SECONDS:
      input:
        label: OSS SIGNED URL TTL SECONDS
        secret: false
        required: false
      services:
        - web
    ORS_API_KEY:
      input:
        label: ORS API KEY
        secret: true
        required: false
      services:
        - web
    ORS_BASE_URL:
      input:
        label: ORS BASE URL
        secret: false
        required: false
      services:
        - web
    ORS_RPM:
      input:
        label: ORS RPM
        secret: false
        required: false
      services:
        - web
    ORS_DAILY_BUDGET:
      input:
        label: ORS DAILY BUDGET
        secret: false
        required: false
      services:
        - web
    POI_BASE_URL:
      input:
        label: POI BASE URL
        secret: false
        required: false
      services:
        - web
    VISION_PROVIDER:
      input:
        label: VISION PROVIDER
        secret: false
        required: false
      services:
        - web
    VISION_MODEL:
      input:
        label: VISION MODEL
        secret: false
        required: false
      services:
        - web
    VISION_API_KEY:
      input:
        label: VISION API KEY
        secret: true
        required: false
      services:
        - web
    VISION_DAILY_BUDGET:
      input:
        label: VISION DAILY BUDGET
        secret: false
        required: false
      services:
        - web
    VISION_SCHEMA_VERSION:
      input:
        label: VISION SCHEMA VERSION
        secret: false
        required: false
      services:
        - web
    VISION_PROMPT_VERSION:
      input:
        label: VISION PROMPT VERSION
        secret: false
        required: false
      services:
        - web
    VISION_TIMEOUT_MS:
      input:
        label: VISION TIMEOUT MS
        secret: false
        required: false
      services:
        - web
    ACCESSIBILITY_CLOUD_APP_TOKEN:
      input:
        label: ACCESSIBILITY CLOUD APP TOKEN
        secret: true
        required: false
      services:
        - web
    ACCESSIBILITY_CLOUD_SOURCE_IDS:
      input:
        label: ACCESSIBILITY CLOUD SOURCE IDS
        secret: false
        required: false
      services:
        - web
    ACCESSIBILITY_CLOUD_LICENSE_IDS:
      input:
        label: ACCESSIBILITY CLOUD LICENSE IDS
        secret: false
        required: false
      services:
        - web
    PROVIDER_LEDGER_SNAPSHOT:
      input:
        label: PROVIDER LEDGER SNAPSHOT
        secret: true
        required: false
      services:
        - web
services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: accessloop
      POSTGRES_DB: accessloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U accessloop -d accessloop
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_MODE: demo
      REGION_ID: unsw-kensington-facilities-demo
    depends_on:
      db:
        condition: service_healthy
    pre_start:
      - command:
          - pnpm
          - db:migrate
      - command:
          - pnpm
          - exec
          - tsx
          - scripts/zenith-initialize.ts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  postgres-data: null
