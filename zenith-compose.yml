x-zenith:
  catalog:
    name: AccessLoop
    description: Accessible campus places, wheelchair route planning, and temporary barrier reports.
    authors: [AccessLoop contributors]
    source: https://github.com/ZMX8Z/AccessLoop
    license: UNLICENSED
    tags: [accessibility, maps, nextjs]
  expose:
    - { service: web, port: 3000, web: true }
  storage:
    database:
      volume: postgres-data
      label: AccessLoop PostgreSQL data
  env:
    APP_BASE_URL:
      alias: ZENITH_PUBLIC_URL
      services: [web]
    PAYLOAD_SECRET:
      generate: '[A-Za-z0-9]{64}'
      services: [web]
    SESSION_SECRET:
      generate: '[A-Za-z0-9]{64}'
      services: [web]
    DATABASE_URL:
      input: { label: PostgreSQL URL, secret: true, required: true }
      services: [web]
    POSTGRES_PASSWORD:
      input: { label: PostgreSQL password matching DATABASE_URL, secret: true, required: true }
      services: [db]

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: accessloop
      POSTGRES_DB: accessloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U accessloop -d accessloop']
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: .
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_MODE: demo
      REGION_ID: unsw-kensington-facilities-demo
    depends_on:
      db: { condition: service_healthy }
    pre_start:
      - command: [pnpm, db:migrate]
      - command: [pnpm, exec, tsx, scripts/zenith-initialize.ts]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
